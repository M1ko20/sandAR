[project]
name = "sandbox"
version = "0.1.0"
description = "Interaktivní AR pískoviště – Kinect v2 + projektor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "moderngl>=5.10",
    "glfw>=2.6",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
piskoviste = "sandbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
